# Deploys the static GitHub Pages build of myip.
#
# One-time setup: repo Settings → Pages → Build and deployment →
# Source: "GitHub Actions". After that, every push to `main` (or a manual
# run via the Actions tab) builds and publishes the site to
# https://<username>.github.io/<repo>/ automatically.
#
# The static build runs the app fully client-side: the browser aggregates
# IP data directly from CORS-enabled public APIs and resolves DNS over
# DNS-over-HTTPS (see src/lib/client-lookup.ts). Server features such as
# the REST API live on the canonical Cloudflare Workers deployment.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        env:
          BUILD_TARGET: static
          NEXT_PUBLIC_STATIC_BUILD: "1"
          # Base path = /<repo-name> for project pages (e.g. /myip).
          # Override here if you rename the repo or use a custom domain.
          NEXT_PUBLIC_BASE_PATH: ""
        run: |
          # Route handlers (the REST API) are server-only: they are excluded
          # from the static export — the static build talks to the public
          # APIs directly from the browser instead.
          rm -rf src/app/api
          bun run build
          # GitHub Pages would otherwise run Jekyll and hide _next assets.
          touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
